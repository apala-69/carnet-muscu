<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte</title>
<meta name="description" content="Mes séances de musculation, avec une photo pour chaque exercice.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout : une colonne mobile (max 520px) centrée, barre d'onglets fixe en bas, séance en plein écran. Direction claire sportswear : blanc, quasi-noir, gris de fond pour les photos, un seul accent vert acide. */
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#6B6B6D; --line:#E5E5E5; --soft:#F5F5F5; --stroke:#CACACB;
  --accent:#DEFF4A; --accent-edge:#A7C21F; --danger:#B3000A; --danger-bg:#FFF1F0;
  --display:'Anton','Arial Narrow','Helvetica Neue',sans-serif;
  --text:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--text);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:22px}
.wrap.full{padding-bottom:130px}
.p{transition:transform 160ms var(--ease)}
.p:active{transform:scale(0.97)}
.seg,.chip{transition:background-color 120ms ease,color 120ms ease,border-color 120ms ease}
@media (prefers-reduced-motion:reduce){.p,.seg,.chip,.demo img,.sheet,.rest{transition:none!important;animation:none!important}}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.2px;line-height:.92}
.h1{font-size:clamp(48px,15vw,64px)}
.h2{font-size:40px;line-height:.95}
.title{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;text-transform:uppercase}
.sec-t{font-size:18px;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:500;border:0;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:500;font-size:16px;width:100%;text-decoration:none}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--stroke)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.sm{height:44px;font-size:14px}
.seggroup{display:flex;gap:8px}
.seg{flex:1;height:44px;border-radius:999px;border:1px solid var(--stroke);background:var(--bg);color:var(--ink);font-weight:500;font-size:14px}
.seg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip{flex-shrink:0;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--stroke);background:var(--bg);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scrollx{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.card{background:var(--soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.note{padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.note.accent{background:var(--accent);font-weight:500}
.note.danger{background:var(--danger-bg)}
.note.danger b{color:var(--danger);font-weight:500}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:72px 1fr 18px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li.small-th{grid-template-columns:56px 1fr auto}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;background:var(--soft);overflow:hidden}
.small-th .thumb{width:56px;height:56px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .num{position:absolute;top:5px;left:5px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bg);font-family:var(--display);font-size:12px;display:flex;align-items:center;justify-content:center}
.li .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.li .n{font-size:15px;font-weight:500}
.li .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--muted)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;min-height:48px;padding-top:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;background:none;border:0}
.tab[aria-current="page"]{color:var(--ink)}
.tab svg{width:24px;height:24px}
/* séance */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.clock{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:2px}
.demo{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:20px;background:var(--soft);overflow:hidden}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 260ms ease}
.demo img.b{opacity:0}
.demo.show-b img.b{opacity:1}
.demo .ctrl{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.94)}
.demo .ctrl button{height:32px;padding:0 12px;border-radius:999px;border:0;background:transparent;font-size:13px;font-weight:500}
.demo .ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo .open{position:absolute;top:12px;right:12px}
.steps{margin:0;padding:14px 16px 14px 34px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.sets-h,.set{display:grid;grid-template-columns:26px minmax(0,1fr) 64px 52px 50px 44px;gap:6px;align-items:center}
.sets-h{font-size:11px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.set{padding:8px 0;border-bottom:1px solid var(--line)}
.set .k{font-family:var(--display);font-size:20px}
.set .prev{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set input{width:100%;height:42px;border-radius:10px;border:0;background:var(--soft);text-align:center;font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rir{height:42px;border-radius:10px;border:1px solid var(--stroke);background:var(--bg);font-weight:500}
.check{width:44px;height:44px;border-radius:50%;border:1px solid var(--stroke);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;transition:background-color 120ms ease,color 120ms ease,transform 160ms var(--ease)}
.check:active{transform:scale(0.94)}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check svg{width:18px;height:18px}
.warm{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;border:1px dashed var(--stroke);font-size:13px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.dock-in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.round{width:52px;height:52px;flex-shrink:0;border-radius:50%;border:1px solid var(--stroke);background:var(--bg);display:flex;align-items:center;justify-content:center}
.round svg{width:20px;height:20px}
/* repos */
.rest{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;opacity:1;transition:opacity 180ms ease}
.rest-in{max-width:480px;margin:0 auto;min-height:100%;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.big{font-family:var(--display);font-size:132px;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
/* feuilles */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;transform:translateY(0);transition:transform 240ms cubic-bezier(0.32,0.72,0,1)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--danger-bg)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:12px 0 12px 14px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stats .stat:nth-child(2n+1){border-left:0;padding-left:0}
.stats.three .stat{border-left:1px solid var(--line);padding-left:14px}
.stats.three .stat:nth-child(3n+1){border-left:0;padding-left:0}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats.four .stat{border-left:1px solid var(--line);padding-left:10px}
.stats.four .stat:first-child{border-left:0;padding-left:0}
.stat b{font-family:var(--display);font-weight:400;font-size:30px}
.vol{display:grid;grid-template-columns:70px minmax(0,1fr) 46px;gap:10px;align-items:center}
.track{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.track .tgt{position:absolute;top:0;bottom:0;background:var(--accent)}
.track .done{position:absolute;top:0;bottom:0;left:0;background:var(--ink);border-radius:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;text-align:left}
.tile .im{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:14px;background:var(--soft);overflow:hidden}
.tile .im img{width:100%;height:100%;object-fit:cover;display:block}
.fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:12px;color:var(--muted);text-align:center}
.day{height:48px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.day.past{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.day.today{border-color:var(--ink);color:var(--ink)}
.day.empty{border-color:transparent;background:transparent}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.sq{width:6px;height:6px;border-radius:2px;background:var(--accent);border:1px solid var(--accent-edge)}
.field{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.field textarea,.field input,.field select{border:1px solid var(--stroke);border-radius:16px;padding:12px 14px;font-weight:400;background:var(--bg);font-size:16px}
.cyc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.cyc span{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.cyc i{height:8px;border-radius:4px;background:var(--line)}
.cyc .on i{background:var(--ink)}
.cyc .cur{color:var(--ink);font-weight:600}
.cyc .dl i{background:repeating-linear-gradient(90deg,var(--stroke) 0 4px,var(--bg) 4px 7px)}
details.prog{border-bottom:1px solid var(--line)}
details.prog summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer}
details.prog summary::-webkit-details-marker{display:none}
.empty-st{padding:18px;border-radius:16px;border:1px dashed var(--stroke);font-size:14px;color:var(--muted);line-height:1.45}
.chart{width:100%;height:auto;display:block}
.hist{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;align-items:end;height:130px}
.hist div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hist i{width:100%;border-radius:6px;background:var(--line);display:block}
.hist div:last-child i{background:var(--ink)}
.hist div:last-child{color:var(--ink);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;transition:opacity 200ms ease}
</style>
</head>
<body>

<div id="app" aria-live="polite"></div>

<script>
/* ============ Données : exercices (photos domaine public free-exercise-db) ============ */
const EX = {
legpress:{n:'Presse à cuisses',g:'Jambes',v:'Jambes',m:'Quadriceps · fessiers',eq:'Machine',s:["Dos et fessiers collés au dossier, pieds à largeur d'épaules au milieu de la plateforme.","Descends lentement jusqu'à environ 90° aux genoux.","Pousse avec les talons en expirant, sans verrouiller les genoux en haut."],e:["Genoux qui rentrent vers l'intérieur.","Bas du dos qui se décolle en bas du mouvement."]},
hacksquat:{n:'Hack squat',g:'Jambes',v:'Jambes',m:'Quadriceps · fessiers',eq:'Machine',s:["Dos et épaules contre les appuis, pieds à largeur d'épaules.","Descends jusqu'à cuisses parallèles à la plateforme.","Remonte en poussant sur les talons."],e:["Talons qui décollent.","Genoux qui rentrent vers l'intérieur."]},
legext:{n:'Leg extension',g:'Jambes',v:'Jambes',m:'Quadriceps',eq:'Machine',s:["Genou aligné avec l'axe de la machine, boudin sur le bas du tibia.","Tends les jambes en contractant les cuisses.","Redescends lentement."],e:["Donner un coup de pied pour lancer la charge.","Décoller les fesses du siège."]},
legcurl:{n:'Leg curl assis',g:'Jambes',v:'Jambes',m:'Ischio-jambiers',eq:'Machine',s:["Règle le dossier : genou aligné avec l'axe de la machine.","Plie les jambes en ramenant les talons sous le siège.","Reviens lentement jusqu'à jambes presque tendues."],e:["Soulever les hanches du siège.","Remonter trop vite."]},
lyinglegcurl:{n:'Leg curl allongé',g:'Jambes',v:'Jambes',m:'Ischio-jambiers',eq:'Machine',s:["Allongé sur le ventre, boudin juste au-dessus des talons.","Ramène les talons vers les fesses.","Redescends en 2 secondes."],e:["Cambrer le bas du dos.","Hanches qui se soulèvent du banc."]},
rdl:{n:'Soulevé de terre jambes tendues',g:'Jambes',v:'Jambes',m:'Ischios · fessiers',eq:'Barre',s:["Debout, barre contre les cuisses, genoux légèrement fléchis.","Descends la barre le long des jambes en poussant les fesses en arrière.","Remonte en serrant les fessiers, dos toujours droit."],e:["Arrondir le dos.","Éloigner la barre des jambes."]},
calfstand:{n:'Mollets debout',g:'Jambes',v:'Jambes',m:'Mollets',eq:'Machine',s:["Épaules sous les appuis, avant des pieds sur la marche.","Monte sur la pointe des pieds le plus haut possible.","Descends lentement talons sous la marche."],e:["Plier les genoux.","Faire des rebonds rapides."]},
calfseated:{n:'Mollets assis',g:'Jambes',v:'Jambes',m:'Mollets',eq:'Machine',s:["Assis, genoux sous l'appui, avant des pieds sur la marche.","Monte sur la pointe des pieds.","Redescends lentement en étirant le mollet."],e:["Amplitude trop courte.","Aller trop vite."]},
chestpress:{n:'Chest press',g:'Pecs',v:'Pecs',m:'Pectoraux · triceps',eq:'Machine',s:["Règle le siège : poignées à hauteur du milieu de la poitrine.","Omoplates serrées contre le dossier, pousse en expirant.","Reviens en 2 secondes, sans laisser la charge toucher la pile."],e:["Coudes écartés à 90° : stress sur les épaules.","Épaules qui avancent en fin de poussée."]},
inclinepress:{n:'Développé incliné machine',g:'Pecs',v:'Pecs',m:'Haut des pectoraux · épaules',eq:'Machine',s:["Poignées à hauteur du haut de la poitrine.","Pousse vers le haut et l'avant en expirant.","Redescends en 2 secondes, dos collé au dossier."],e:["Coudes écartés à 90°.","Dos qui se décolle du dossier."]},
butterfly:{n:'Pec deck',g:'Pecs',v:'Pecs',m:'Pectoraux',eq:'Machine',s:["Bras légèrement fléchis, coudes à hauteur des épaules ou un peu en dessous.","Ramène les bras devant toi en serrant les pectoraux.","Ouvre lentement jusqu'à sentir l'étirement."],e:["Tendre complètement les bras.","Ouvrir trop loin derrière le corps."]},
crossover:{n:'Écartés à la poulie',g:'Pecs',v:'Pecs',m:'Pectoraux',eq:'Poulie',s:["Un pas en avant entre les deux poulies, buste légèrement penché.","Ramène les mains devant toi en arc de cercle.","Reviens lentement, coudes légèrement fléchis."],e:["Plier et tendre les coudes pendant le mouvement.","Charge trop lourde qui tire les épaules."]},
inclinedb:{n:'Développé incliné haltères',g:'Pecs',v:'Pecs',m:'Haut des pectoraux',eq:'Haltères',s:["Banc incliné à 30°, haltères à hauteur de poitrine.","Pousse vers le haut en rapprochant légèrement les haltères.","Redescends lentement, coudes à 45° du corps."],e:["Banc trop incliné : ça devient un exercice d'épaules.","Rebondir en bas du mouvement."]},
latpull:{n:'Tirage vertical',g:'Dos',v:'Dos',m:'Grand dorsal · biceps',eq:'Poulie haute',s:["Cuisses bloquées sous les boudins, mains un peu plus larges que les épaules.","Tire la barre vers le haut de la poitrine en abaissant les coudes.","Remonte lentement jusqu'à bras tendus."],e:["Se balancer en arrière pour tirer.","Tirer la barre derrière la nuque."]},
closepull:{n:'Tirage vertical prise serrée',g:'Dos',v:'Dos',m:'Grand dorsal',eq:'Poulie haute',s:["Prise serrée, buste légèrement incliné en arrière.","Tire vers le haut de la poitrine, coudes le long du corps.","Remonte en contrôlant."],e:["Tirer avec les bras plutôt qu'avec le dos.","Se balancer."]},

const pad = n => String(n).padStart(2,'0');

const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const monday = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };

const LS_KEY = 'carnet-muscu-v1';
let DB = null;
const S = { sessions:[], shakers:{}, weights:{}, settings:null };
function defaultSettings(){ return { days:3, cycleStart: iso(monday(new Date())), favs:[], lastShaker:{type:'Whey',dose:30} }; }
function lsLoad(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); Object.assign(S, d); } } catch(e){} }

async function dbWrite(fn){ if (!DB) { lsSave(); return; } try { await fn(); } catch(e){ toast(e && e.code==='quota_exceeded' ? 'Stockage plein : supprime d\'anciennes données.' : 'Enregistrement impossible pour le moment, réessaie.'); } }

function saveWeight(d){ dbWrite(()=> S.weights[d]!=null ? DB.doc('weights/'+d).set({date:d,kg:S.weights[d]}) : DB.doc('weights/'+d).delete()); }
function saveSessionRec(rec){ S.sessions.push(rec); S.sessions.sort((a,b)=>a.ts-b.ts); dbWrite(()=>DB.doc('sessions/'+rec.id).set(rec)); }
function deleteSessionRec(id){ S.sessions = S.sessions.filter(s=>s.id!==id); dbWrite(()=>DB.doc('sessions/'+id).delete()); }

async function connect(){
  try { DB = await (window.claude && window.claude.use ? window.claude.use('db') : null); } catch(e){ DB = null; }
  if (!DB) return;
  const live = () => { if (!LIVE && !REST) render(); };
  DB.collection('sessions').onSnapshot(q => { S.sessions = q.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>a.ts-b.ts); live(); }, ()=>{});
  DB.collection('shakers').onSnapshot(q => { const o={}; q.docs.forEach(d=>{ const x=d.data(); if (x) o[x.date]=x.entries||[]; }); S.shakers=o; live(); }, ()=>{});
  DB.collection('weights').onSnapshot(q => { const o={}; q.docs.forEach(d=>{ const x=d.data(); if (x) o[x.date]=x.kg; }); S.weights=o; live(); }, ()=>{});
  DB.doc('settings/main').onSnapshot(s => { if (s.exists) { S.settings = Object.assign(defaultSettings(), s.data()); } else { S.settings = settings(); saveSettings(); } live(); }, ()=>{});
}

/* ============ Logique d'entraînement ============ */
function cycleInfo(){
  const st = settings();
  const start = monday(parseISO(st.cycleStart));
  const weeks = Math.max(0, Math.floor((monday(new Date()) - start) / (7*864e5)));
  return { num: Math.floor(weeks/6)+1, week: weeks%6+1 };
}
/* Séances : programme du coach (PLANS) ou séances personnalisées (settings.plan), qui servent toutes les semaines. */
const PLAN_IDS = ['S1','S2','S3','E'];
const planMode = () => (settings().plan && settings().plan.mode) || 'coach';
const MODE_NAME = {coach:'Programme du coach', perso:'Mes séances', claude:'Programme de Claude'};
function planItems(id){ const pl=settings().plan; return planMode()==='coach' ? PLANS[id].items : ((pl && pl[id]) || []); }
function ensurePerso(){ const st=settings(); if (planMode()!=='coach') return; const pl={mode:'perso'}; PLAN_IDS.forEach(id=>pl[id]=PLANS[id].items.map(x=>x.slice())); st.plan=pl; }
function editPlan(id, fn){ ensurePerso(); const st=settings(); st.plan[id]=st.plan[id]||[]; fn(st.plan[id]); if (st.plan.mode==='claude') st.plan.mode='perso'; saveSettings(); }
function buildPlan(id){
  const base = PLANS[id]; const deload = cycleInfo().week===6;
  let name = base.name;
  const items = planItems(id).filter(it=>EX[it[0]]).map((it,i)=>{
    let [k,sets,lo,hi,rest] = it;
    if (deload) sets = Math.max(1,Math.ceil(sets/2));
    return {k,sets,lo,hi,rest};
  });
  return {id,name,items,deload};
}
const ZONE = {legpress:'Cuisses',hacksquat:'Cuisses',legext:'Cuisses',legcurl:'Ischios',lyinglegcurl:'Ischios',rdl:'Ischios',calfstand:'Mollets',calfseated:'Mollets'};
const zone = k => ZONE[k] || EX[k].z || EX[k].v;
/* Type d'exercice : poly (gros exercice), iso (isolation), abdo, gainage (reps = secondes) */
const POLY_V1 = ['legpress','hacksquat','rdl','chestpress','inclinepress','inclinedb','latpull','closepull','seatedrow','isorow','highrow','shoulderpress','milpress','dbpress'];
const exType = k => EX[k].t || (POLY_V1.includes(k) ? 'poly' : EX[k].g==='Abdos' ? 'abdo' : 'iso');
const repTxt = (k,lo,hi) => lo+'-'+hi+(exType(k)==='gainage'?' s':'');
/* Séries × reps × repos selon l'objectif (repères Schoenfeld, Israetel, Nuckols) */
const OBJ = [
  {id:'masse', n:'Prise de masse', poly:[3,8,12,150], iso:[3,10,15,75], abdo:[3,12,15,60], gainage:[3,30,60,60]},
  {id:'force', n:'Force', poly:[4,3,6,210], iso:[3,8,12,90], abdo:[3,10,15,60], gainage:[3,45,60,60]},
  {id:'endurance', n:'Endurance', poly:[3,12,15,60], iso:[2,15,20,45], abdo:[3,15,20,45], gainage:[3,45,90,45]}
];
const defItem = k => { const [sets,lo,hi,rest] = OBJ[0][exType(k)]; return [k,sets,lo,hi,rest]; };
function weekKey(){ return iso(monday(new Date())); }
function weekChosen(){ return settings().daysWeek === weekKey(); }
function weekPlan(){
  const ids = {3:['S1','S2','S3'], 2:['S1','S2'], 1:['E']}[settings().days];
  return ids.map((id,i)=>{ const p=buildPlan(id); p.slot=i+1; p.name='Séance '+(i+1); return p; });
}
function doneCount(){ return weekSessions().length; }
function nextSlot(){ return Math.min(doneCount()+1, settings().days); }
function estMinutes(plan){ let s=0; plan.items.forEach(it=>{ s += it.sets*(45+it.rest); }); return Math.round(s/60)+6; }
function historyOf(k){ return S.sessions.filter(s=>s.items.some(i=>i.k===k)).map(s=>({date:s.date,sets:s.items.find(i=>i.k===k).sets})); }
function lastOf(k){ const h = historyOf(k); return h.length ? h[h.length-1] : null; }
function bestOf(k, beforeTs){ let b=null; S.sessions.forEach(s=>{ if (beforeTs && s.ts>=beforeTs) return; s.items.forEach(i=>{ if(i.k!==k) return; i.sets.forEach(x=>{ if(!b || x.kg>b.kg || (x.kg===b.kg && x.reps>b.reps)) b={kg:x.kg,reps:x.reps}; }); }); }); return b; }
function advice(k, it){
  const last = lastOf(k);
  if (!last || !last.sets.length) return { kg:null, text:"Première fois : choisis une charge que tu peux soulever "+it.hi+" fois en gardant 2 reps en réserve." };
  const max = Math.max(...last.sets.map(s=>s.kg));
  const top = last.sets.filter(s=>s.kg===max);
  const allTop = last.sets.length>=it.sets && last.sets.every(s=>s.reps>=it.hi);
  const pz = painFor(k), gap = daysOff();
  if (pz.length) { const kg=round25(max*0.9); return { kg, text:'Gêne '+pz.map(z=>z.toLowerCase()).join(', ')+' signalée : prends 10 % plus léger ('+kgs(kg)+') et arrête si ça tire.' }; }
  if (gap>=8) { const kg=round25(max*0.9); return { kg, text:gap+' jours sans séance : reprends à '+kgs(kg)+' (10 % plus léger), tu remonteras vite.' }; }
  if (allTop) return { kg: max+2.5, up:true, text: it.hi+' reps partout la dernière fois : passe à '+kgs(max+2.5)+'.' };
  return { kg:max, text:'Garde '+kgs(max)+' et vise une rep de plus que la dernière fois.' };
}
function weekSessions(){ const m = monday(new Date()); return S.sessions.filter(s=>parseISO(s.date)>=m); }
function weekVolume(){ const v={}; VOL.forEach(g=>v[g]=0); weekSessions().forEach(s=>s.items.forEach(i=>{ const e=EX[i.k]; if(e) v[e.v]+=i.sets.length; })); return v; }
function stalls(){
  const out=[];
  Object.keys(EX).forEach(k=>{ const h = historyOf(k); if (h.length<3) return; const last3 = h.slice(-3).map(x=>Math.max(...x.sets.map(s=>s.kg))); if (last3[0]===last3[1] && last3[1]===last3[2]) out.push({k,kg:last3[2]}); });
  return out;
}

/* ---- Séance ---- */

  if (LIVE){ render(); return; }
  const wp = weekPlan(); const plan = wp[Math.min(PICK||nextSlot(), wp.length)-1];
  if (!plan.items.length){ EDIT=plan.id; go('programmes'); return; }
  LIVE = { plan, idx:0, start:Date.now(), mode:'anim', data: plan.items.map(it=>{ const a=advice(it.k,it); const last=lastOf(it.k); return { k:it.k, orig:it.k, sets: Array.from({length:it.sets},(_,j)=>({kg: a.kg!=null?String(a.kg).replace('.',','):'', reps: last&&last.sets[j]?String(last.sets[j].reps):'', rir:2, done:false})) }; }) };
  saveDraft(); requestWake(); unlockAudio();
  clockTimer = setInterval(()=>{ const c=document.getElementById('clock'); if (c&&LIVE) c.textContent = mmss((Date.now()-LIVE.start)/1000); }, 1000);
  window.scrollTo(0,0); render();
}

function parseClaude(txt){
  const m=txt.match(/\{[\s\S]*\}/g); if (!m) return {err:'Je ne trouve pas le bloc JSON dans le texte collé.'};
  let j=null; for (const c of m.reverse()){ try { j=JSON.parse(c); break; } catch(e){} }
  if (!j) return {err:'Le bloc JSON est mal formé. Copie toute la réponse de Claude.'};
  const out={}, unknown=[]; let n=0;
  PLAN_IDS.forEach(id=>{ if (!Array.isArray(j[id])) return; out[id]=j[id].filter(x=>{ if (!Array.isArray(x) || !EX[x[0]]){ unknown.push(Array.isArray(x)?x[0]:'?'); return false; } return true; })
    .map(x=>{ const d=defItem(x[0]); const num=(v,lo,hi,df)=>{ v=Math.round(+v); return v>=lo&&v<=hi?v:df; }; const lo=num(x[2],1,120,d[2]), hi=num(x[3],lo,120,Math.max(lo,d[3])); return [x[0],num(x[1],1,8,d[1]),lo,hi,num(x[4],20,300,d[4])]; }); n+=out[id].length; });
  if (!n) return {err:'Aucun exercice reconnu dans la réponse.'};
  return {plan:out, unknown};
}
function applyClaude(){
  const r=parseClaude(CLAUDE_TXT||''); if (r.err){ toast(r.err); return; }
  const st=settings(); const pl={mode:'claude'}; PLAN_IDS.forEach(id=>pl[id]=r.plan[id]||planItems(id).map(x=>x.slice())); st.plan=pl; saveSettings(); CLAUDE_TXT='';
  render(); window.scrollTo(0,0); toast('Programme de Claude appliqué'+(r.unknown.length?' ('+r.unknown.length+' exercice(s) ignoré(s))':''));
}

const EQS = ['Tout','Machine','Poulie','Haltères','Barre','Poids du corps'];
const eqOf = e => /Poulie/.test(e.eq)?'Poulie':/Barre fixe|Barres parallèles|Poids du corps|Chaise|Banc/.test(e.eq)?'Poids du corps':/Barre/.test(e.eq)?'Barre':e.eq;
const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function filterEx(f){
  const q=norm(f.q.trim()); const favs=settings().favs||[];
  return Object.keys(EX).filter(k=>{ const e=EX[k];
    if (f.g==='Favoris' && !favs.includes(k)) return false;
    if (f.g!=='Tous' && f.g!=='Favoris' && e.g!==f.g) return false;
    if (f.eq && f.eq!=='Tout' && eqOf(e)!==f.eq) return false;
    return !q || norm(e.n+' '+e.m+' '+e.eq+' '+e.g+' '+zone(k)).includes(q); });

  'Dos':['rdl','hacksquat','legpress','seatedrow','squat','frontsquat','smithsquat','deadlift','sumo','dbrdl','goodmorning','bbrow','tbar','smithrow','rackpull','backext','ohp'],
  'Épaules':['chestpress','inclinepress','inclinedb','shoulderpress','milpress','dbpress','butterfly','crossover','bench','inclinebench','declinebench','dbbench','smithbench','smithincline','machinebench','dbfly','inclinefly','pullover','dipschest','dips','benchdips','ohp','arnold','smithohp','uprightrow'],
  'Genoux':['legext','hacksquat','legpress','squat','frontsquat','smithsquat','gobletsquat','dbsquat','splitsquat','lunge','reverselunge','walklunge','stepup','narrowpress','singlelegext'],
  'Coudes':['tricepsrope','pushdown','overheadrope','preacher','cablepreacher','machinecurl','skull','closebench','dbext','kickback','reversepush','vbarpush','onearmtri','machinetri','bbcurl','ezcurl','preacherbar','dips']
};
const dayDiff = (a,b) => Math.round((parseISO(b)-parseISO(a))/864e5);
// Dernière douleur signalée il y a moins de 14 jours (une séance « Aucune » efface l'alerte).
function activePain(){
  const s=[...S.sessions].reverse().find(x=>Array.isArray(x.pain));
  if (!s || !s.pain.length || dayDiff(s.date,today())>14) return null;
  return { zones:s.pain, date:s.date };
}
function painFor(k){ const p=activePain(); return p ? p.zones.filter(z=>(STRESS[z]||[]).includes(k)) : []; }
function daysOff(){ const l=S.sessions[S.sessions.length-1]; return l ? dayDiff(l.date,today()) : 0; }
const topKg = sets => sets.length ? Math.max(...sets.map(x=>x.kg)) : 0;
function coachTips(){
  const out=[]; const ss=S.sessions;
  if (!ss.length) return [{t:'info',h:'Le coach',x:'Il analysera tes séances dès la première : progression, charges qui montent trop vite, douleurs, pauses.'}];
  const p=activePain();
  if (p) out.push({t:'warn',h:'Gêne : '+p.zones.join(', ').toLowerCase(),x:'Signalée le '+frDate(parseISO(p.date),{day:'numeric',month:'long'})+'. Les exercices qui la sollicitent sont proposés 10 % plus légers, avec un remplacement. Si la douleur dure plus d\'une semaine, est vive ou descend dans la jambe ou le bras : médecin ou kiné.'});
  const off=daysOff();
  if (off>=8) out.push({t:'info',h:'Reprise',x:off+' jours sans séance : les charges proposées sont baissées de 10 % pour repartir en douceur.'});
  const jumps=[], stuck=[], fail=[], ups=[];
  Object.keys(EX).forEach(k=>{
    const h=historyOf(k); if (!h.length) return;
    const last=h[h.length-1], prev=h[h.length-2];
    if (prev){ const a=topKg(prev.sets), b=topKg(last.sets); if (a>0 && b-a>2.5 && (b-a)/a>0.10) jumps.push({k,a,b}); }
    const half=last.sets.length && last.sets.filter(x=>x.rir===0).length*2>=last.sets.length;
    if (half && dayDiff(last.date,today())<=14) fail.push(k);
    const recent=h.filter(x=>dayDiff(x.date,today())<=28);
    if (recent.length>=2){ const d=topKg(recent[recent.length-1].sets)-topKg(recent[0].sets); if (d>0) ups.push({k,d}); }
  });
  jumps.forEach(j=>{ const back=['rdl','hacksquat','squat','frontsquat','deadlift','sumo','dbrdl','goodmorning','bbrow','tbar','rackpull'].includes(j.k);
    out.push({t:'warn',h:'Charge qui monte vite',x:EX[j.k].n+' : '+fmt(j.a)+' → '+fmt(j.b)+' kg d\'un coup (+'+Math.round((j.b-j.a)/j.a*100)+' %). Monte par 2,5 kg : les muscles suivent vite, les tendons'+(back?' et le bas du dos':'')+' moins.'}); });

}

/* ---- Nutrition : 2 objectifs du jour + ajustement chaque semaine ---- */
const round50 = n => Math.round(n/50)*50;
function lastWeight(){ const wk=Object.keys(S.weights).sort(); return wk.length ? S.weights[wk[wk.length-1]] : null; }
// Tendance du poids : variation par semaine, entre la dernière pesée et une pesée d'au moins 6 jours plus tôt.
function weightTrend(){
  const wk=Object.keys(S.weights).sort(); if (wk.length<2) return null;
  const lastD=wk[wk.length-1]; const ref=wk.filter(d=>dayDiff(d,lastD)>=6).pop(); if (!ref) return null;
  const per=(S.weights[lastD]-S.weights[ref])/(dayDiff(ref,lastD)/7);
  return { per, pct: per/S.weights[ref]*100 };
}
function nutriState(){
  const st=settings(); const w=lastWeight(); if (w==null) return {w:null};
  const nu=st.nutri||{};
  const kcal = nu.kcal || round50(w*33+300);   // départ : entretien estimé (≈ 33 kcal/kg) + 300
  const prot = Math.round(w*1.6/5)*5;
  const tr=weightTrend(); let adj=0, verdict=null;
  if (tr){ if (tr.pct<0.25){ adj=150; verdict='slow'; } else if (tr.pct>0.5){ adj=-150; verdict='fast'; } else verdict='ok'; }
  const done = nu.lastAdj===weekKey();
  return { w, kcal, prot, tr, adj: done?0:adj, verdict, done, estimated: !nu.kcal };
}

  const n=nutriState(); if (!n.w) return '';

}

  if (!S.sessions.length || dayDiff(S.sessions[0].date, today()) < 42) return null;
  const st=settings(), later=st.freeLater||{};
  const ids=weekPlan().map(p=>p.id), used=new Set(ids.flatMap(id=>planItems(id).map(x=>x[0])));
  for (const k of Object.keys(FREE_SWAP)) {

/* ---- Calcul des disques (barre de 20 kg, barre EZ de 10 kg) ---- */
const PLATES = [25,20,15,10,5,2.5,1.25];
function platesFor(k, kg){
  const e=EX[k]; if (!e || !/^Barre( EZ)?$/.test(e.eq)) return null;
  const bar = e.eq==='Barre EZ' ? 10 : 20;
  if (!(kg>0)) return {bar, txt:'Entre la charge totale (barre comprise) : l\'appli te dit quels disques mettre.'};
  if (kg<bar) return {bar, txt:'Moins que la barre seule ('+bar+' kg).'};
  let side=(kg-bar)/2; const out=[];
  PLATES.forEach(p=>{ while (side>=p-1e-9){ out.push(p); side=Math.round((side-p)*100)/100; } });
  return {bar, txt: out.length ? 'Barre '+bar+' kg + de chaque côté : '+out.map(p=>String(p).replace('.',',')).join(' + ')+' kg'+(side>0?' (reste '+fmt(side*2)+' kg)':'') : 'Barre seule ('+bar+' kg).'};
}
function platesLine(d){
  const s0=d.sets.find(x=>!x.done)||d.sets[d.sets.length-1]; const r=platesFor(d.k, parseFloat(String(s0?s0.kg:'').replace(',','.')));
  return r ? '<div class="warm" id="plates" style="border-style:solid"><b style="font-weight:500">Disques</b><span>'+esc(r.txt)+'</span></div>' : '';
}

/* ---- Bilan de la semaine passée (lundi à mercredi) ---- */
function lastWeekStats(){
  const m=monday(new Date()), pm=new Date(m); pm.setDate(pm.getDate()-7);
  const ss=S.sessions.filter(s=>{ const d=parseISO(s.date); return d>=pm && d<m; });
  const sets=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.sets.length,0),0);
  const vol=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.sets.reduce((c,x)=>c+x.kg*x.reps,0),0),0);
  let recs=0; ss.forEach(s=>s.items.forEach(i=>{ const prev=bestOf(i.k, s.ts); const b=i.sets.reduce((a,x)=>(!a||x.kg>a.kg||(x.kg===a.kg&&x.reps>a.reps))?x:a,null); if (prev && b && (b.kg>prev.kg||(b.kg===prev.kg&&b.reps>prev.reps))) recs++; }));
  const w=Object.keys(S.weights).sort(), inW=w.filter(d=>{ const x=parseISO(d); return x<m; });
  const wNow=inW.length?S.weights[inW[inW.length-1]]:null, wPrev=inW.filter(d=>parseISO(d)<pm).pop();
  return { ss, sets, vol, recs, dW: wNow!=null && wPrev ? wNow-S.weights[wPrev] : null, key: iso(pm) };
}
function vWeekReview(){
  const st=settings(), now=new Date(), wd=(now.getDay()+6)%7;
  if (wd>2 || st.reviewSeen===weekKey()) return '';
  const r=lastWeekStats(); if (!r.ss.length) return '';
  const tip=coachTips().find(c=>c.t==='warn')||coachTips().find(c=>c.t==='info');
  return '<section class="card"><div class="between" style="align-items:center"><h2 class="display" style="font-size:24px">Ta semaine passée</h2><button class="icon-btn p" style="background:var(--bg)" data-act="review-ok" aria-label="Fermer le bilan">'+svg('x')+'</button></div>'+
  '<div class="stats" style="border-top-color:var(--stroke)"><div class="stat"><span class="small muted">Séances</span><b>'+r.ss.length+' / '+st.days+'</b></div><div class="stat"><span class="small muted">Records</span><b>'+r.recs+'</b></div><div class="stat"><span class="small muted">Séries</span><b>'+r.sets+'</b></div><div class="stat"><span class="small muted">Charge totale</span><b>'+Math.round(r.vol/100)/10+' t</b></div></div>'+
  (r.dW!=null?'<span class="small">Poids : <b style="font-weight:600">'+(r.dW>=0?'+':'')+fmt(r.dW)+' kg</b> sur la semaine.</span>':'')+
  (tip?'<span class="small"><b style="font-weight:600">À retenir :</b> '+esc(tip.h)+' · '+esc(tip.x)+'</span>':'<span class="small"><b style="font-weight:600">À retenir :</b> continue sur ta lancée, vise une rep de plus partout.</span>')+
  '</section>';
}

function exportData(){

  const blob=new Blob([JSON.stringify(file,null,1)],{type:'application/json'});

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);

function readImport(text){
  let j; try { j=JSON.parse(text); } catch(e){ return null; }
  const d = j && j.data ? j.data : j;   // accepte aussi le contenu brut du stockage
  if (!d || typeof d!=='object' || !Array.isArray(d.sessions)) return null;
  const obj = x => x && typeof x==='object' && !Array.isArray(x) ? x : {};
  const sessions = d.sessions.filter(x=>x && x.id && x.date && Array.isArray(x.items)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const photos = Array.isArray(d.photos) ? d.photos.filter(x=>x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && /^data:image\//.test(x.url)) : [];
  return { photos, sessions, shakers:obj(d.shakers), weights:obj(d.weights), settings: d.settings && typeof d.settings==='object' ? Object.assign(defaultSettings(), d.settings) : settings() };
}
async function applyImport(){
  const n=IMPORT; IMPORT=null; CONFIRM=null; if (!n) return;
  const old={sessions:S.sessions, shakers:S.shakers, weights:S.weights};
  S.sessions=n.sessions; S.shakers=n.shakers; S.weights=n.weights; S.settings=n.settings; PICK=null;
  if (!DB) lsSave();
  else await dbWrite(async()=>{
    for (const x of old.sessions) if (!n.sessions.some(y=>y.id===x.id)) await DB.doc('sessions/'+x.id).delete();
    for (const d of Object.keys(old.shakers)) if (!n.shakers[d]) await DB.doc('shakers/'+d).delete();
    for (const d of Object.keys(old.weights)) if (n.weights[d]==null) await DB.doc('weights/'+d).delete();
    for (const x of n.sessions) await DB.doc('sessions/'+x.id).set(x);
    for (const d of Object.keys(n.shakers)) await DB.doc('shakers/'+d).set({date:d,entries:n.shakers[d]});
    for (const d of Object.keys(n.weights)) await DB.doc('weights/'+d).set({date:d,kg:n.weights[d]});
    await DB.doc('settings/main').set(n.settings);
  });
  try { for (const x of n.photos) await idbPut(x.date, x.url); await loadPhotos(); } catch(e){}
  render(); toast('Données importées');
}

    case 'abandon': CONFIRM=null; LIVE=null; REST=null; clearInterval(clockTimer); saveDraft(); try{wake&&wake.release();}catch(e){} render(); break;
    case 'rir': { const s=L.data[L.idx].sets[+el.dataset.j]; s.rir=(s.rir+1)%4; saveDraft(); render(); break; }
    case 'check': { const d=L.data[L.idx], j=+el.dataset.j, s=d.sets[j]; unlockAudio();
      if (!s.done && (!(num(s.kg)>=0) || String(s.kg).trim()==='' )){ toast('Entre la charge (kg) avant de valider.'); document.getElementById('kg-'+L.idx+'-'+j)?.focus(); return; }
      if (!s.done && String(s.reps).trim()===''){ s.reps=String(L.plan.items[L.idx].hi); }
      s.done=!s.done;
      if (s.done){ for(let x=j+1;x<d.sets.length;x++){ if(!d.sets[x].done && String(d.sets[x].kg).trim()==='') d.sets[x].kg=s.kg; } }
      saveDraft();
      const allDone=L.data.every(x=>x.sets.every(y=>y.done));
      if (s.done && !allDone){ const rest=L.plan.items[L.idx].rest; if (d.sets.every(y=>y.done) && L.idx<L.data.length-1){ L.idx++; window.scrollTo(0,0); } startRest(rest); }
      render(); if (allDone && s.done){ toast('Toutes les séries sont faites. Termine la séance en bas.'); }
      break; }
    case 'addset': { const d=L.data[L.idx]; const lastS=d.sets[d.sets.length-1]; d.sets.push({kg:lastS?lastS.kg:'',reps:'',rir:2,done:false}); saveDraft(); render(); break; }
    case 'next': L.idx=Math.min(L.data.length-1,L.idx+1); L.mode='anim'; saveDraft(); render(); window.scrollTo(0,0); break;
    case 'prev': L.idx=Math.max(0,L.idx-1); L.mode='anim'; saveDraft(); render(); window.scrollTo(0,0); break;
    case 'sheet-swap': SHEET='swap'; render(); break;
    case 'sheet-list': SHEET='list'; render(); break;
    case 'close-sheet': SHEET=null; render(); break;
    case 'jump': L.idx=+el.dataset.i; SHEET=null; saveDraft(); render(); window.scrollTo(0,0); break;
    case 'swap': { const d=L.data[L.idx]; d.k=el.dataset.k; const it=L.plan.items[L.idx]; const ad=advice(d.k,it); d.sets=d.sets.map(()=>({kg:ad.kg!=null?String(ad.kg).replace('.',','):'',reps:'',rir:2,done:false})); SHEET=null; saveDraft(); render(); window.scrollTo(0,0); break; }

    case 'rest-plus': REST.end+=15000; REST.total+=15; tickRest(); break;
    case 'rest-skip': clearTimeout(REST.t); REST=null; render(); break;

    case 'claude': copyReport(); break;

  if ((k==='kg'||k==='reps') && LIVE){ const s=LIVE.data[LIVE.idx].sets[+t.dataset.j]; s[k]=t.value; saveDraft();
    if (k==='kg'){ const pl=document.getElementById('plates'); if (pl){ const tmp=document.createElement('div'); tmp.innerHTML=platesLine(LIVE.data[LIVE.idx]); pl.replaceWith(tmp.firstChild); } }
    if (k==='kg' && +t.dataset.j===0 && LIVE.idx===0){ const w=parseFloat(t.value.replace(',','.')); const box=document.querySelector('.warm'); if (box) box.innerHTML = w>0 ? '<b style="font-weight:500">Échauffement calculé</b><span>50 % · '+kgs(round25(w*.5))+' × 10</span><span>75 % · '+kgs(round25(w*.75))+' × 5</span>' : '<b style="font-weight:500">Échauffement</b><span>Entre ta charge de travail : les 2 séries légères se calculent toutes seules.</span>'; } }
  else if (k==='note' && END){ END.rec.note=t.value; }
  else if (k==='libq'){ LIB.q=t.value; const l=document.getElementById('liblist'); if (l) l.innerHTML=libList(); }
  else if (k==='pq'){ PQ.q=t.value; const l=document.getElementById('pklist'); if (l) l.innerHTML=pickList(); }
  else if (k==='claudetxt'){ CLAUDE_TXT=t.value; }
});
app.addEventListener('change', ev=>{
  if (ev.target.dataset.in==='progex'){ PROG_EX=ev.target.value; render(); }
  if (ev.target.dataset.in==='ed'){ const t=ev.target, i=+t.dataset.i, f=t.dataset.f, v=t.value;
    editPlan(EDIT, l=>{ const it=l[i]; if (f==='sets') it[1]=+v; else if (f==='reps'){ const [lo,hi]=v.split('-').map(Number); it[2]=lo; it[3]=hi; } else if (f==='rest') it[4]=+v; });
    render(); }
  if (ev.target.dataset.in==='photo'){ const f=ev.target.files && ev.target.files[0]; if (!f) return;
    shrink(f).then(u=>idbPut(today(),u)).then(loadPhotos).then(()=>{ render(); toast('Photo ajoutée'); document.getElementById('mesures')?.scrollIntoView({block:'center'}); }).catch(()=>toast('Impossible d\'enregistrer la photo sur ce téléphone.')); }
  if (ev.target.dataset.in==='import'){ const f=ev.target.files && ev.target.files[0]; if (!f) return;
    f.text().then(t=>{ const d=readImport(t); if (!d){ toast('Ce fichier n\'est pas une sauvegarde Fonte.'); return; } IMPORT=d; CONFIRM='import'; render(); document.getElementById('donnees')?.scrollIntoView({block:'center'}); }); }
});
app.addEventListener('submit', ev=>{
  ev.preventDefault();
  if (ev.target.dataset.form==='meas'){ const f=ev.target, rec={}; let n=0, bad=false;
    MEAS.forEach(([k])=>{ const raw=f.elements[k].value.trim(); if (!raw) return; const v=parseFloat(raw.replace(',','.')); if (!(v>10&&v<250)) bad=true; else { rec[k]=Math.round(v*10)/10; n++; } });
    if (bad || !n){ toast('Entre au moins une mesure en cm, par exemple 34,5.'); return; }
    const st=settings(); st.measures=Object.assign({},st.measures); st.measures[today()]=Object.assign({},st.measures[today()],rec); saveSettings(); render(); toast('Mesures enregistrées'); return; }
  if (ev.target.dataset.form==='weight'){ const v=parseFloat(document.getElementById('wkg').value.replace(',','.')); if (!(v>30&&v<250)){ toast('Entre un poids en kg, par exemple 72,5.'); return; } const d=today(); S.weights[d]=Math.round(v*10)/10; saveWeight(d); render(); toast('Pesée ajoutée'); }
});
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && LIVE) { requestWake(); if (REST) tickRest(); } });
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if (TABS.some(t=>t[0]===h) && h!==VIEW && !LIVE){ VIEW=h; FICHE=null; render(); } });

/* ============ Démarrage ============ */
lsLoad(); settings();
try { const dr=sessionStorage.getItem(LS_KEY+'-live'); if (dr){ LIVE=JSON.parse(dr); clockTimer=setInterval(()=>{ const c=document.getElementById('clock'); if (c&&LIVE) c.textContent=mmss((Date.now()-LIVE.start)/1000); },1000); } } catch(e){}
{ let h=location.hash.slice(1); if (h==='shakers') h='nutrition'; if (TABS.some(t=>t[0]===h)) VIEW=h; }
render();
connect();
loadPhotos().then(()=>{ if (PHOTOS.length && VIEW==='progres' && !LIVE) render(); });
</script>
